name: Build Cemu LD+ APK

# Downloads SSimco's Cemu Android port at a fixed commit, applies lightfix.patch,
# builds the APK and publishes it as a GitHub release for direct download on the device.
# It can also build "Cemu Control" (the same Cemu with no fixes, only a separate app id) for comparison tests,
# see the commented-out matrix entry below.

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

env:
  CEMU_REPO: https://github.com/SSimco/Cemu.git
  CEMU_COMMIT: 8759323e5b72594665b55e02f99db3c1e1e7de8a
  VCPKG_BINARY_SOURCES: "clear;files,/home/runner/vcpkg-binary-cache,readwrite"
  VCPKG_FORCE_DOWNLOADED_BINARIES: true
  # throwaway test signing key, kept fixed so newer test builds install over older ones
  TEST_KEYSTORE_B64: 

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: lightfix
            patch: lightfix.patch
            apk: Cemu-LDPlus.apk
          # "Cemu Control" = same Cemu with no fixes, for comparison tests. Uncomment to build it again.
          # - variant: control
          #   patch: control.patch
          #   apk: Cemu-Control-test.apk
    env:
      VCPKG_ROOT: "${{ github.workspace }}/cemu/dependencies/vcpkg"

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: lightfix

      - name: Download Cemu source and apply the patch
        run: |
          git clone "$CEMU_REPO" cemu
          cd cemu
          git checkout "$CEMU_COMMIT"
          git submodule update --init --recursive
          git apply --verbose "../lightfix/${{ matrix.patch }}"

      - name: Install system dependencies
        run: |
          sudo apt update -qq
          sudo apt install -y gettext

      - name: Uncompile message catalogs
        working-directory: cemu
        run: |
          for mo_file in bin/resources/*/cemu.mo
          do
            language_code=$(basename $(dirname $mo_file))
            po_file=src/android/app/src/main/assets/translations/$language_code/cemu.po
            mkdir -p $(dirname $po_file)
            msgunfmt $mo_file -o $po_file || echo "Failed to uncompile message catalog from $mo_file"
          done

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: /home/runner/vcpkg-binary-cache
          key: vcpkg-android-${{ env.CEMU_COMMIT }}-${{ matrix.variant }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-android-${{ env.CEMU_COMMIT }}-${{ matrix.variant }}-
            vcpkg-android-${{ env.CEMU_COMMIT }}-
            vcpkg-android-

      - name: Bootstrap vcpkg
        working-directory: cemu
        run: |
          mkdir -p /home/runner/vcpkg-binary-cache
          bash ./dependencies/vcpkg/bootstrap-vcpkg.sh

      - name: Set up signing key
        run: |
          # fixed key so every build can be installed as an update over the previous one
          echo "$TEST_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/lightfix.keystore"
          echo "ANDROID_STORE_FILE=$RUNNER_TEMP/lightfix.keystore" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_STORE_PASSWORD=android" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: cemu/src/android
        run: |
          export JAVA_HOME=$JAVA_HOME_21_X64
          ./gradlew assembleRelease

      - name: Collect APK
        run: |
          mkdir -p out
          APK=$(find cemu/src/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found $APK"
          cp "$APK" "out/${{ matrix.apk }}"
          ls -la out

      - name: Check the APK is signed with the fixed key
        run: |
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -n 1)apksigner
          "$APKSIGNER" verify --print-certs "out/${{ matrix.apk }}" | tee signer.txt
          grep -qi "SHA-256 digest: 70921a61c17e664a1cf7d4f6aa810097b40029b6d17e7a19a3d17b3c8977d3f2" signer.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant }}
          path: out/${{ matrix.apk }}

  publish:
    needs: build-android
    runs-on: ubuntu-24.04
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Cemu LD+ build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Unofficial build of [SSimco's Cemu for Android](https://github.com/SSimco/Cemu) made for **LEGO Dimensions**: lighting fix, Toy Pad on the second screen, and better sound.

            **Download:** `Cemu-LDPlus.apk` below. It installs as a separate app called **Cemu LD+** next to your regular Cemu, and as an update over Cemu Light Fix (saves and settings stay).

            - Play at **1280x720** (set *LEGO Dimensions → Resolution* to the default, or leave it off). Higher resolutions may still have lighting problems.
            - Setup tips (game profile settings, volume boost, moving your save and shader cache): see the [README](https://github.com/${{ github.repository }}#readme).
            - Problems? Open an [Issue](https://github.com/${{ github.repository }}/issues) and attach your log (game list menu → **Share log file**).

            Not affiliated with SSimco or the Cemu team. Based on SSimco/Cemu commit `${{ env.CEMU_COMMIT }}`. Licensed under MPL-2.0.
          files: out/*.apk
